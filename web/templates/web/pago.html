{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" %} rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{
            background: #f5f5f5;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .payment-card{
            border: none;
            border-radius: 18px;
        }
        .summary-card{
            border: none;
            border-radius: 18px;
            position: sticky;
            top: 20px;
        }
        .form-control{
            border-radius: 10px;
            padding: 12px;
        }
        .payment-method{
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .payment-method:hover{
            border-color: #0d6efd;
            background: #f8fbff;
        }
    </style>
</head>
<body>
    <header class="py-3 bg-white border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="{% url 'web:index' %}"class="d-flex align-items-center text-dark text-decoration-none">
                <i class="bi bi-at fs-1 fw-bold"></i>
                <span class="fs-4 fw-bold ms-2">
                    Nexo Digital
                </span>
            </a>
            <a href="{% url 'web:productos' %}" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Volver
            </a>
        </div>
    </header>
    <main class="container py-5">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card payment-card shadow-sm p-4">
                    <h3 class="fw-bold mb-4">
                        <i class="bi bi-credit-card"></i>
                        Información de Pago
                    </h3>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Apellido</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control">
                        </div>
                        <div class="col-12" id="address-field">
                            <label class="form-label fw-semibold">Dirección</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-12 mt-3">
                            <label class="form-label fw-semibold mb-3">Método de entrega</label>
                            <div class="d-flex flex-column gap-3">
                                <div class="payment-method">
                                    <input type="radio" checked name="delivery" value="delivery" onchange="toggleDeliveryFields()">
                                    <i class="bi bi-truck ms-2"></i>
                                    Despacho a domicilio
                                </div>
                                <div class="payment-method">
                                    <input type="radio" name="delivery" value="pickup" onchange="toggleDeliveryFields()">
                                    <i class="bi bi-shop ms-2"></i>
                                    Retiro en tienda
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr class="my-4">
                    <h5 class="fw-bold mb-3">Método de pago</h5>
                    <div class="d-flex flex-column gap-3">
                        <div class="payment-method">
                            <input type="radio" checked name="payment" value="card" onchange="togglePaymentFields()">
                            <i class="bi bi-credit-card ms-2"></i>
                            Tarjeta de Crédito / Débito
                        </div>
                        <div class="payment-method">
                            <input type="radio" name="payment" value="paypal" onchange="togglePaymentFields()">
                            <i class="bi bi-paypal ms-2"></i>
                            PayPal
                        </div>
                    </div>
                    <hr class="my-4">
                    <div id="card-fields">
                        <h5 class="fw-bold mb-3">Datos de Tarjeta</h5>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Número de tarjeta</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Fecha de expiración</label>
                                <input type="text" class="form-control" placeholder="MM/AA">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">CVV</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card summary-card shadow-sm p-4">
                    <h4 class="fw-bold mb-4">
                        Resumen del Pedido
                    </h4>
                    <div id="checkout-items"></div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Despacho</span>
                        <span id="shipping-price">Gratis</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fs-4 fw-bold mb-4">
                        <span>Total</span>
                        <span class="text-primary">
                            $<span id="checkout-total">0</span></span>
                    </div>
                    <button class="btn btn-primary w-100 py-3 fw-bold" onclick="finishPurchase()">
                        <i class="bi bi-lock-fill"></i>
                        Confirmar Compra
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="{% static 'app.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
