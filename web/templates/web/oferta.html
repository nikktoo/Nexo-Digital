{% extends "web/base.html" %}

{% load static %}

{% block title %}Ofertas - Nexo Digital{% endblock %}

{% block content %}
    <main class="container my-5">
        <div class="p-5 mb-4 bg-dark text-white rounded-3">
            <h1 class="fw-bold">🔥 Ofertas del Mes</h1>
            <p class="mb-0">Hasta 30% de descuento en equipos seleccionados</p>
        </div>
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=500" alt="Switch">
                    <div class="card-body text-center">
                        <span class="badge bg-danger mb-2">-30%</span>
                        <h6 class="fw-bold">Switch PoE 24 Puertos</h6>
                        <p class="text-muted text-decoration-line-through">$899.900</p>
                        <h5 class="text-danger">$624.900</h5>
                        <button class="btn btn-outline-dark w-100" onclick="addToCart('prod2','Switch PoE',624900,'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=500')">Añadir al carrito</button>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1563207153-f403bf289096?w=500" alt="Cable">
                    <div class="card-body text-center">
                        <span class="badge bg-danger mb-2">-20%</span>
                        <h6 class="fw-bold">Cable UTP Cat 6</h6>
                        <p class="text-muted text-decoration-line-through">$120.000</p>
                        <h5 class="text-danger">$95.000</h5>
                        <button class="btn btn-outline-dark w-100" onclick="addToCart('prod4','Cable UTP',95000,'https://images.unsplash.com/photo-1563207153-f403bf289096?w=500')">Añadir al carrito</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
